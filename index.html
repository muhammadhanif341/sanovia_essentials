<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1E120B" />
    <meta name="description" content="Sanovia Essentials — minimal everyday essentials. Watches and jewellery." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Sanovia Essentials</title>
    <!-- Paint the brand surface before CSS/JS load: no white flash on a dark site. -->
    <style>
      html { background: #1e120b; color-scheme: dark; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Polite live region for route + cart announcements. Lives OUTSIDE #root because
      #root is made `inert` while a dialog is open, and inert subtrees don't announce.
    -->
    <div id="sv-live" class="sv-sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
    <noscript>
      <p style="padding:2rem;font-family:sans-serif;color:#f7f1e7">
        Sanovia Essentials needs JavaScript to run. You can still order on WhatsApp: +92 328 6097302.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
